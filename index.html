<!DOCTYPE html>
<html lang="th" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxflash - ค้นหา Flash Express และจุดบริการใกล้คุณ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between smooth-transition">

    <!-- Top Navigation / Header -->
    <nav class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-3 shadow-sm sticky top-0 z-50 smooth-transition">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-amber-500 text-white rounded-xl flex items-center justify-center shadow-md transform hover:rotate-6 smooth-transition">
                    <i class="fas fa-shipping-fast text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800 dark:text-white leading-tight">Boxflash</h1>
                    <p class="text-xs text-slate-400 dark:text-slate-400" data-i18n="nav_subtitle">ค้นหา Flash ใกล้คุณ & เช็กพัสดุ</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Language Switcher Button -->
                <button onclick="toggleLanguage()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 smooth-transition" id="lang-btn">
                    🇹🇭 TH
                </button>
                <!-- Theme Switcher Button -->
                <button onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 smooth-transition text-amber-500 dark:text-amber-400" id="theme-btn" title="Toggle Theme">
                    <i class="fas fa-sun" id="theme-icon"></i>
                </button>

                <div id="user-nav-area" class="hidden items-center gap-2 ml-1">
                    <div id="user-email-display" class="text-xs font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-full hidden sm:flex items-center gap-1.5 smooth-transition"></div>
                    <button onclick="logout()" class="text-xs text-rose-600 hover:text-rose-700 dark:text-rose-400 font-medium px-3 py-1.5 rounded-lg border border-rose-200 dark:border-rose-900 hover:bg-rose-50 dark:hover:bg-rose-950/50 smooth-transition active:scale-95" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto w-full p-4 md:p-6 my-auto">

        <!-- ================= AUTH SECTION (Login / Register) ================= -->
        <div id="auth-section" class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 smooth-transition">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
                <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-amber-600 border-b-2 border-amber-500 smooth-transition" data-i18n="tab_login">เข้าสู่ระบบ</button>
                <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition" data-i18n="tab_register">สมัครสมาชิก</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_email">อีเมล</label>
                    <input type="email" id="login-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_password">รหัสผ่าน</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-300">
                        <input type="checkbox" id="remember-me" class="rounded border-slate-300 dark:border-slate-700 text-amber-600 focus:ring-amber-500 w-4 h-4">
                        <span data-i18n="remember_me">จดจำการเข้าสู่ระบบ</span>
                    </label>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm text-sm active:scale-[0.99]" data-i18n="btn_login">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="event.preventDefault(); handleRegister();" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_reg_email">อีเมลสำหรับสมัคร</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_reg_password">สร้างรหัสผ่าน</label>
                    <input type="password" id="reg-password" required placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm text-sm active:scale-[0.99]" data-i18n="btn_register">
                    สร้างบัญชีผู้ใช้ใหม่
                </button>
            </form>
        </div>

        <!-- ================= DASHBOARD SECTION ================= -->
        <div id="dashboard-section" class="space-y-6 hidden">
            
            <!-- Dashboard Navigation Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-slate-200 dark:bg-slate-800 p-1.5 rounded-2xl smooth-transition">
                <button onclick="switchMainTab('hubs')" id="main-tab-hubs" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-700 text-amber-600 dark:text-amber-400 shadow-sm smooth-transition flex items-center justify-center gap-2">
                    <i class="fas fa-map-marked-alt"></i> <span data-i18n="maintab_hubs">ค้นหา Flash ใกล้ฉัน</span>
                </button>
                <button onclick="switchMainTab('tracking')" id="main-tab-tracking" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 smooth-transition flex items-center justify-center gap-2">
                    <i class="fas fa-search-location"></i> <span data-i18n="maintab_tracking">เช็กพัสดุ & ประวัติ</span>
                </button>
            </div>

            <!-- TAB 1: FLASH HUBS & LOCATOR (DEFAULT TAB) -->
            <div id="content-hubs" class="space-y-6 smooth-transition transform transition-all duration-300 opacity-150 translate-y-0">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4 smooth-transition hover:shadow-md">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                <i class="fas fa-warehouse text-amber-500"></i> <span data-i18n="hubs_header_title">ค้นหาสถานที่ Flash ใกล้คุณ</span>
                            </h2>
                            <p class="text-xs text-slate-400 mt-0.5" data-i18n="hubs_header_sub">กรอกตำบล อำเภอ หรือชื่อพื้นที่ เพื่อดูสาขา Flash ที่ใกล้ที่สุด</p>
                        </div>
                        <!-- Add Hub Button: Visible ONLY for Admin -->
                        <button id="btn-add-hub-container" onclick="openAddHubModal()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium px-3.5 py-2 rounded-xl smooth-transition flex items-center gap-1.5 shadow-sm active:scale-95">
                            <i class="fas fa-plus"></i> <span data-i18n="btn_add_hub">เพิ่มสาขาแฟลช (แอดมิน)</span>
                        </button>
                    </div>

                    <!-- Address Input & Search Bar -->
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_address_input">กรอกตำแหน่งที่อยู่ของคุณ (เช่น เขต, แขวง, จังหวัด, หรือชื่อถนน)</label>
                            <div class="relative flex gap-2">
                                <div class="relative flex-1">
                                    <input type="text" id="user-address-input" oninput="searchNearbyFlash()" placeholder="เช่น บางเขน, ลาดพร้าว, รัชดาภิเษก, เชียงใหม่..." class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                    <i class="fas fa-map-marker-alt absolute left-3.5 top-3.5 text-amber-500 text-base"></i>
                                </div>
                                <button onclick="searchNearbyFlash()" class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-3 rounded-xl font-medium text-xs sm:text-sm shadow-sm smooth-transition flex items-center gap-1.5 active:scale-95">
                                    <i class="fas fa-search"></i> <span data-i18n="btn_search_flash">ค้นหา</span>
                                </button>
                            </div>
                        </div>

                        <!-- Filter Type Option -->
                        <div class="flex items-center gap-2 pt-1">
                            <span class="text-xs text-slate-400 font-medium" data-i18n="filter_type_label">กรองประเภท:</span>
                            <select id="flash-type-filter" onchange="searchNearbyFlash()" class="px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-amber-500 smooth-transition">
                                <option value="all" data-i18n="opt_all_flash">🟡 ทุกประเภท (Flash Express & Flash Home)</option>
                                <option value="hub" data-i18n="opt_flash_hub">📦 Flash Express Hub (ศูนย์คัดแยกและกระจายสินค้า)</option>
                                <option value="home" data-i18n="opt_flash_home">🏪 Flash Home / Service Point (จุดรับฝากส่งพัสดุ)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Hubs Result List Container -->
                    <div id="hubs-list" class="space-y-3 pt-3 max-h-[420px] overflow-y-auto pr-1 transition-all duration-300">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- TAB 2: TRACKING & HISTORY -->
            <div id="content-tracking" class="space-y-6 hidden smooth-transition transform transition-all duration-300 opacity-0 translate-y-2">
                <!-- Tracking Card -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 smooth-transition hover:shadow-md">
                    <h2 class="text-base font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i class="fas fa-search-location text-amber-500"></i> <span data-i18n="track_title">เช็กพัสดุด่วน</span>
                    </h2>
                    <form onsubmit="event.preventDefault(); trackParcel();" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_carrier">เลือกบริษัทขนส่ง</label>
                            <select id="carrier" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                <option value="flash">Flash Express</option>
                                <option value="thpost">ไปรษณีย์ไทย (Thailand Post)</option>
                                <option value="kerry">Kerry Express (KEX)</option>
                                <option value="j&t">J&T Express</option>
                                <option value="lalamove">Lalamove</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_tracking_no">เลขติดตามพัสดุ</label>
                            <div class="relative">
                                <input type="text" id="tracking-number" placeholder="กรอกเลขพัสดุที่นี่..." class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                <i class="fas fa-barcode absolute left-4 top-3.5 text-slate-400 text-base"></i>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm flex items-center justify-center gap-2 text-sm active:scale-[0.99]" data-i18n="btn_track">
                            <i class="fas fa-external-link-alt"></i> เปิดหน้าเช็กพัสดุ & บันทึกล่าสุด
                        </button>
                    </form>
                </div>

                <!-- Recent History Section -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 smooth-transition hover:shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fas fa-history text-slate-600 dark:text-slate-400"></i> <span data-i18n="history_title">ประวัติการเช็คล่าสุด</span>
                        </h2>
                        <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-700 dark:text-rose-400 font-medium smooth-transition" data-i18n="btn_clear_history">
                            <i class="fas fa-trash-alt mr-1"></i> ล้างประวัติ
                        </button>
                    </div>
                    <div id="history-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Modal: Add Flash Branch (Admin Only) -->
    <div id="add-hub-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 smooth-transition">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-slate-200 dark:border-slate-700 transform scale-95 opacity-0 smooth-transition" id="modal-content-box">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-slate-800 dark:text-white text-base flex items-center gap-2">
                    <i class="fas fa-map-marker-alt text-amber-500"></i> <span data-i18n="modal_title">เพิ่มสาขา Flash Express / Flash Home</span>
                </h3>
                <button onclick="closeAddHubModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 smooth-transition">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <form onsubmit="event.preventDefault(); saveNewHub();" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1" data-i18n="modal_name">ชื่อสาขา / จุดบริการ</label>
                    <input type="text" id="new-hub-name" required placeholder="เช่น Flash Express สาขาบางเขน / Flash Home ม.เกษตร" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 smooth-transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1" data-i18n="modal_carrier">ประเภทบริการ Flash</label>
                    <select id="new-hub-carrier" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium smooth-transition">
                        <option value="hub">📦 Flash Express Hub (ศูนย์หลัก / กระจายสินค้า)</option>
                        <option value="home">🏪 Flash Home / Service Point (จุดรับพัสดุย่อย)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1" data-i18n="modal_area">พื้นที่ / โซน / เขต / จังหวัด</label>
                    <input type="text" id="new-hub-area" required placeholder="เช่น บางเขน, จตุจักร, ลาดพร้าว, กรุงเทพฯ" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 smooth-transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1" data-i18n="modal_address">ที่อยู่โดยละเอียด</label>
                    <input type="text" id="new-hub-address" required placeholder="เลขที่ ซอย ถนน แขวง เขต จังหวัด" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 smooth-transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1" data-i18n="modal_hours">เวลาเปิด-ปิดบริการ</label>
                    <input type="text" id="new-hub-hours" required placeholder="เช่น 08:00 - 20:00 น. (เปิดทุกวัน)" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 smooth-transition">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddHubModal()" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-medium py-2.5 rounded-xl smooth-transition" data-i18n="modal_cancel">ยกเลิก</button>
                    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 rounded-xl smooth-transition shadow-sm active:scale-95" data-i18n="modal_save">บันทึกสาขา</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-6">
        <p>Boxflash &bull; Flash Express Branch Finder System</p>
    </footer>

    <!-- App Logic & Localization Script -->

            const password = document.getElementById('login-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            const validUser = users.find(u => u.email === email && u.password === password);

            if (!validUser) {
                alert(currentLang === 'th' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'Invalid email or password.');

                sessionStorage.setItem('boxflash_logged_user', JSON.stringify(sessionData));

        function trackParcel() {
            const carrier = document.getElementById('carrier').value;
            const trackingNo = document.getElementById('tracking-number').value.trim();

            if (!trackingNo) {
                alert(currentLang === 'th' ? 'กรุณากรอกเลขพัสดุก่อนครับ' : 'Please enter tracking number.');
                document.getElementById('tracking-number').focus();
                return;
            }

            let targetUrl = '';
            let carrierName = '';

            switch(carrier) {
                case 'flash':
                    carrierName = 'Flash Express';
                    targetUrl = `https://www.flashexpress.co.th/tracking/?se=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'thpost':
                    carrierName = currentLang === 'th' ? 'ไปรษณีย์ไทย' : 'Thailand Post';
                    targetUrl = `https://track.thailandpost.com/?trackNumber=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'kerry':
                    carrierName = 'Kerry (KEX)';
                    targetUrl = `https://th.kexexpress.com/en/track?id=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'j&t':
                    carrierName = 'J&T Express';
                    targetUrl = `https://www.jtexpress.co.th/index/query/gz.html?billcode=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'lalamove':
                    carrierName = 'Lalamove';
                    targetUrl = `https://www.lalamove.com/th-th/`;
                    break;
                default:
                    carrierName = 'General Search';
                    targetUrl = `https://www.google.com/search?q=${encodeURIComponent(trackingNo + ' tracking')}`;
            }

            saveHistory(carrierName, trackingNo, targetUrl);
            window.open(targetUrl, '_blank');
            
            document.getElementById('tracking-number').value = '';
            loadHistory();
        }

        function getLoggedUserEmail() {
            let loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || '{}');
            return loggedUser.email || 'guest';
        }

        function saveHistory(carrierName, trackingNo, url) {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            if (!allHistory[userEmail]) {
                allHistory[userEmail] = [];
            }

            allHistory[userEmail] = allHistory[userEmail].filter(item => item.trackingNo !== trackingNo);
            allHistory[userEmail].unshift({
                carrierName,
                trackingNo,
                url,
                time: new Date().toLocaleString(currentLang === 'th' ? 'th-TH' : 'en-US', { dateStyle: 'short', timeStyle: 'short' })
            });

            if (allHistory[userEmail].length > 15) {
                allHistory[userEmail].pop();
            }

            localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
        }

        function loadHistory() {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            let userHistory = allHistory[userEmail] || [];

            const historyList = document.getElementById('history-list');
            
            if (userHistory.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">${translations[currentLang].no_history}</p>`;
                return;

                                <i class="fas fa-external-link-alt text-[10px]"></i> ${currentLang === 'th' ? 'เปิดดู' : 'View'}

                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function deleteHistoryItem(index) {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            if (allHistory[userEmail]) {

        function clearHistory() {
            if (confirm(currentLang === 'th' ? 'คุณต้องการล้างประวัติการเช็กทั้งหมดใช่หรือไม่?' : 'Are you sure you want to clear all history?')) {

        function searchNearbyFlash() {
            const hubsListContainer = document.getElementById('hubs-list');
            const addressQuery = document.getElementById('user-address-input').value.toLowerCase().trim();
            const typeFilter = document.getElementById('flash-type-filter').value;
            const loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || '{}');
            const isAdmin = (loggedUser.email === ADMIN_EMAIL);

            let branches = JSON.parse(localStorage.getItem('boxflash_flash_branches') || '[]');

            // Filter branches
            let filtered = branches.filter(item => {
                const matchType = (typeFilter === 'all' || item.carrierType === typeFilter);
                
                // If user didn't type anything, show all or top branches
                if (!addressQuery) return matchType;

                const matchArea = item.name.toLowerCase().includes(addressQuery) || 
                                  item.area.toLowerCase().includes(addressQuery) || 
                                  item.address.toLowerCase().includes(addressQuery);
                return matchType && matchArea;
            });

            // If query doesn't match specific area keywords, fallback to showing all with simulated distances or sort
            let displayList = filtered.length > 0 ? filtered : (addressQuery ? branches.filter(item => typeFilter === 'all' || item.carrierType === typeFilter) : branches);

            if (displayList.length === 0) {
                hubsListContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">${translations[currentLang].no_hubs}</p>`;

                // Simulated distance based on index or query relevance
                let simulatedKm = (idx * 0.8 + 0.5).toFixed(1);

                let deleteBtnHtml = isAdmin ? `

                html += `
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl space-y-2.5 hover:border-amber-400 dark:hover:border-amber-500 smooth-transition hover:shadow-sm">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${badgeColor} inline-block mb-1">${typeLabel}</span>
                                <h3 class="font-bold text-slate-800 dark:text-white text-sm sm:text-base">${hub.name}</h3>
                            </div>
                            <span class="text-[11px] bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-900 px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1 shrink-0">
                                <i class="fas fa-route text-amber-500"></i> ~${simulatedKm} กม.
                            </span>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-400 flex items-start gap-1.5">
                            <i class="fas fa-map-marker-alt text-amber-500 mt-0.5 shrink-0"></i> <span>${hub.address}</span>
                        </p>
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pt-2 border-t border-slate-200/60 dark:border-slate-700/60 gap-2">
                            <span class="text-xs text-emerald-700 dark:text-emerald-400 font-semibold flex items-center gap-1">
                                <i class="far fa-clock"></i> ${currentLang === 'th' ? 'เวลาให้บริการ' : 'Hours'}: ${hub.hours}
                            </span>
                            <div class="flex gap-2 w-full sm:w-auto justify-end">
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hub.name + ' ' + hub.address)}" target="_blank" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs rounded-xl font-medium smooth-transition flex items-center gap-1.5 shadow-sm active:scale-95">
                                    <i class="fas fa-directions"></i> ${currentLang === 'th' ? 'นำทาง Google Maps' : 'Navigate'}
                                </a>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            hubsListContainer.innerHTML = html;
        }

        function openAddHubModal() {
            const modal = document.getElementById('add-hub-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeAddHubModal() {
            const modal = document.getElementById('add-hub-modal');
            const box = document.getElementById('modal-content-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('new-hub-name').value = '';
                document.getElementById('new-hub-area').value = '';
                document.getElementById('new-hub-address').value = '';
                document.getElementById('new-hub-hours').value = '';
            }, 200);
        }

        function saveNewHub() {
            const name = document.getElementById('new-hub-name').value.trim();
            const carrierType = document.getElementById('new-hub-carrier').value;
            const area = document.getElementById('new-hub-area').value.trim();
            const address = document.getElementById('new-hub-address').value.trim();
            const hours = document.getElementById('new-hub-hours').value.trim();

            let branches = JSON.parse(localStorage.getItem('boxflash_flash_branches') || '[]');
            const newBranch = {
                id: Date.now(),
                name,
                carrierType,
                area,
                address,
                hours
            };

            branches.unshift(newBranch);
            localStorage.setItem('boxflash_flash_branches', JSON.stringify(branches));
            
            closeAddHubModal();
            searchNearbyFlash();
            alert(currentLang === 'th' ? 'เพิ่มสาขา Flash สำเร็จ!' : 'Flash branch added successfully!');
        }

        function deleteFlashBranch(id) {
            if (confirm(currentLang === 'th' ? 'คุณต้องการลบสาขานี้ออกจากระบบใช่หรือไม่?' : 'Are you sure you want to delete this branch?')) {
                let branches = JSON.parse(localStorage.getItem('boxflash_flash_branches') || '[]');
                branches = branches.filter(h => h.id !== id);
                localStorage.setItem('boxflash_flash_branches', JSON.stringify(branches));
                searchNearbyFlash();
            }
        }
    </script>
</body>
</html>
