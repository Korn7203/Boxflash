<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxflash - ระบบจัดการพัสดุและคลังสินค้าอัจฉริยะ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        /* Smooth transitions */
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between smooth-transition">

    <!-- Top Navigation / Header -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm sticky top-0 z-50 smooth-transition">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md transform hover:rotate-6 smooth-transition">
                    <i class="fas fa-shipping-fast text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800 leading-tight">Boxflash</h1>
                    <p class="text-xs text-slate-400">ระบบเช็กพัสดุและคลังฮับ/ร้านส่ง</p>
                </div>
            </div>
            <div id="user-nav-area" class="hidden items-center gap-3">
                <div id="user-email-display" class="text-xs font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full hidden sm:flex items-center gap-1.5 smooth-transition"></div>
                <button onclick="logout()" class="text-xs text-rose-600 hover:text-rose-700 font-medium px-3 py-1.5 rounded-lg border border-rose-200 hover:bg-rose-50 smooth-transition active:scale-95">
                    <i class="fas fa-sign-out-alt mr-1"></i> ออกจากระบบ
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto w-full p-4 md:p-6 my-auto">

        <!-- ================= AUTH SECTION (Login / Register) ================= -->
        <div id="auth-section" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 smooth-transition">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6">
                <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 smooth-transition">เข้าสู่ระบบ</button>
                <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition">สมัครสมาชิก</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">อีเมล</label>
                    <input type="email" id="login-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm smooth-transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">รหัสผ่าน</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm smooth-transition">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                        <input type="checkbox" id="remember-me" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4">
                        จดจำการเข้าสู่ระบบ
                    </label>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm text-sm active:scale-[0.99]">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="event.preventDefault(); handleRegister();" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">อีเมลสำหรับสมัคร</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm smooth-transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">สร้างรหัสผ่าน</label>
                    <input type="password" id="reg-password" required placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm smooth-transition">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm text-sm active:scale-[0.99]">
                    สร้างบัญชีผู้ใช้ใหม่
                </button>
            </form>
        </div>

        <!-- ================= DASHBOARD SECTION ================= -->
        <div id="dashboard-section" class="space-y-6 hidden">
            
            <!-- Dashboard Navigation Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1.5 rounded-2xl smooth-transition">
                <button onclick="switchMainTab('tracking')" id="main-tab-tracking" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white text-blue-600 shadow-sm smooth-transition flex items-center justify-center gap-2">
                    <i class="fas fa-search-location"></i> เช็กพัสดุ & ประวัติ
                </button>
                <button onclick="switchMainTab('hubs')" id="main-tab-hubs" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-800 smooth-transition flex items-center justify-center gap-2">
                    <i class="fas fa-warehouse"></i> คลังฮับ & ร้านส่ง
                </button>
            </div>

            <!-- TAB 1: TRACKING & HISTORY -->
            <div id="content-tracking" class="space-y-6 smooth-transition">
                <!-- Tracking Card -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 smooth-transition hover:shadow-md">
                    <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-search-location text-blue-600"></i> เช็กพัสดุด่วน
                    </h2>
                    <form onsubmit="event.preventDefault(); trackParcel();" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">เลือกบริษัทขนส่ง</label>
                            <select id="carrier" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium smooth-transition">
                                <option value="flash">Flash Express</option>
                                <option value="thpost">ไปรษณีย์ไทย (Thailand Post)</option>
                                <option value="kerry">Kerry Express (KEX)</option>
                                <option value="j&t">J&T Express</option>
                                <option value="lalamove">Lalamove</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">เลขติดตามพัสดุ</label>
                            <div class="relative">
                                <input type="text" id="tracking-number" placeholder="กรอกเลขพัสดุที่นี่..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium smooth-transition">
                                <i class="fas fa-barcode absolute left-4 top-3.5 text-slate-400 text-base"></i>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm flex items-center justify-center gap-2 text-sm active:scale-[0.99]">
                            <i class="fas fa-external-link-alt"></i> เปิดหน้าเช็กพัสดุ & บันทึกล่าสุด
                        </button>
                    </form>
                </div>

                <!-- Recent History Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 smooth-transition hover:shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fas fa-history text-slate-600"></i> ประวัติการเช็คล่าสุด
                        </h2>
                        <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-700 font-medium smooth-transition">
                            <i class="fas fa-trash-alt mr-1"></i> ล้างประวัติ
                        </button>
                    </div>
                    <div id="history-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- TAB 2: HUBS & DROP-OFF STORES LOCATOR -->
            <div id="content-hubs" class="space-y-6 hidden smooth-transition">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 smooth-transition hover:shadow-md">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fas fa-warehouse text-emerald-600"></i> ค้นหาคลังฮับ และ ร้านรับฝากส่ง
                        </h2>
                        <!-- Add Hub Button: Visible ONLY for Admin -->
                        <button id="btn-add-hub-container" onclick="openAddHubModal()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3.5 py-2 rounded-xl smooth-transition flex items-center gap-1.5 shadow-sm active:scale-95">
                            <i class="fas fa-plus"></i> เพิ่มตำแหน่งฮับ/ร้านส่ง (แอดมิน)
                        </button>
                    </div>

                    <!-- Filter & Search Bar -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">กรองตามค่าย/ประเภท</label>
                            <select id="hub-filter-carrier" onchange="renderHubs()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 smooth-transition">
                                <option value="all">🌐 ทุกค่ายและร้านส่งทั้งหมด</option>
                                <option value="flash">Flash Express / Flash Home</option>
                                <option value="thpost">ไปรษณีย์ไทย</option>
                                <option value="kerry">Kerry (KEX)</option>
                                <option value="j&t">J&T Express</option>
                                <option value="lalamove">Lalamove Station</option>
                                <option value="partner">🏪 ร้านส่งพัสดุเอกชน (รวมค่าย)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">ค้นหาพื้นที่ / ชื่อสาขา</label>
                            <input type="text" id="hub-search-input" oninput="renderHubs()" placeholder="พิมพ์ชื่อพื้นที่ เช่น บางเขน, ลาดพร้าว..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 smooth-transition">
                        </div>
                    </div>

                    <!-- Hubs List Container -->
                    <div id="hubs-list" class="space-y-3 pt-2 max-h-96 overflow-y-auto pr-1">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Modal: Add Hub / Store Location (Admin Only) -->
    <div id="add-hub-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 smooth-transition">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-slate-200 transform scale-95 opacity-0 smooth-transition" id="modal-content-box">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fas fa-map-marker-alt text-emerald-600"></i> เพิ่มคลังฮับ หรือ ร้านส่งพัสดุ
                </h3>
                <button onclick="closeAddHubModal()" class="text-slate-400 hover:text-slate-600 smooth-transition">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <form onsubmit="event.preventDefault(); saveNewHub();" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-500 uppercase tracking-wider mb-1">ชื่อสาขา / ชื่อร้าน</label>
                    <input type="text" id="new-hub-name" required placeholder="เช่น Boxflash สาขาหลัก / Flash Hub บางเขน" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 smooth-transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 uppercase tracking-wider mb-1">ประเภท / ค่ายขนส่ง</label>
                    <select id="new-hub-carrier" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium smooth-transition">
                        <option value="partner">🏪 ร้านส่งพัสดุเอกชน (รับฝากรวม)</option>
                        <option value="flash">Flash Express</option>
                        <option value="thpost">ไปรษณีย์ไทย</option>
                        <option value="kerry">Kerry Express (KEX)</option>
                        <option value="j&t">J&T Express</option>
                        <option value="lalamove">Lalamove</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 uppercase tracking-wider mb-1">พื้นที่ / โซน (Area)</label>
                    <input type="text" id="new-hub-area" required placeholder="เช่น โซนกรุงเทพเหนือ, ลาดพร้าว, รัชดา" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 smooth-transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 uppercase tracking-wider mb-1">ที่อยู่โดยละเอียด</label>
                    <input type="text" id="new-hub-address" required placeholder="เลขที่ ซอย ถนน แขวง เขต จังหวัด" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 smooth-transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 uppercase tracking-wider mb-1">เวลาเปิด-ปิดบริการ</label>
                    <input type="text" id="new-hub-hours" required placeholder="เช่น 08:30 - 20:00 น. (เปิดทุกวัน)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 smooth-transition">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddHubModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2.5 rounded-xl smooth-transition">ยกเลิก</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl smooth-transition shadow-sm active:scale-95">บันทึกตำแหน่ง</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-6">
        <p>Boxflash &bull; LocalStorage Account & Admin System</p>
    </footer>

    <!-- App Logic Script -->
    <script>
        const ADMIN_EMAIL = 'musicnoa7@gmail.com';
        const ADMIN_PASS = '0918294511';

        const defaultHubs = [
            { id: 1, name: 'Flash Express Hub หลัก', carrier: 'flash', area: 'จตุจักร / ลาดพร้าว', address: '123 ถ.พหลโยธิน แขวงลาดยาว เขตจตุจักร กรุงเทพฯ', hours: '08:00 - 21:00 น.' },
            { id: 2, name: 'ไปรษณีย์ไทย สาขารองเมือง', carrier: 'thpost', area: 'ปทุมวัน / รองเมือง', address: '45 ถ.รองเมือง เขตปทุมวัน กรุงเทพฯ', hours: '08:30 - 17:30 น. (ปิดวันอาทิตย์)' },
            { id: 3, name: 'Kerry Express Parcel Shop', carrier: 'kerry', area: 'สุขุมวิท / อโศก', address: '88/1 สุขุมวิท ซอย 21 แขวงคลองเตยเหนือ กรุงเทพฯ', hours: '09:00 - 20:00 น.' },
            { id: 4, name: 'J&T Express Sorting Hub', carrier: 'j&t', area: 'บางเขน / หลักสี่', address: '99 ถ.แจ้งวัฒนะ แขวงอนุสาวรีย์ เขตบางเขน กรุงเทพฯ', hours: '08:00 - 20:30 น.' },
            { id: 5, name: 'Boxflash Partner Shop (ร้านส่งรวมค่าย)', carrier: 'partner', area: 'รามอินทรา / คันนายาว', address: '210 ถ.รามอินทรา แขวงคันนายาว กรุงเทพฯ', hours: '08:00 - 22:00 น. (เปิดทุกวัน)' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            initAdminAccount();
            initDefaultHubs();
            checkAuthStatus();
        });

        function initAdminAccount() {
            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            if (!users.some(u => u.email === ADMIN_EMAIL)) {
                users.push({ email: ADMIN_EMAIL, password: ADMIN_PASS });
                localStorage.setItem('boxflash_users', JSON.stringify(users));
            }
        }

        function initDefaultHubs() {
            if (!localStorage.getItem('boxflash_hubs')) {
                localStorage.setItem('boxflash_hubs', JSON.stringify(defaultHubs));
            }
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 smooth-transition";
                tabRegister.className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 pb-3 text-sm font-semibold text-emerald-600 border-b-2 border-emerald-600 smooth-transition";
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition";
            }
        }

        function switchMainTab(tab) {
            const btnTracking = document.getElementById('main-tab-tracking');
            const btnHubs = document.getElementById('main-tab-hubs');
            const contentTracking = document.getElementById('content-tracking');
            const contentHubs = document.getElementById('content-hubs');

            if (tab === 'tracking') {
                btnTracking.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white text-blue-600 shadow-sm smooth-transition flex items-center justify-center gap-2";
                btnHubs.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-800 smooth-transition flex items-center justify-center gap-2";
                contentTracking.classList.remove('hidden');
                contentHubs.classList.add('hidden');
            } else {
                btnHubs.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white text-emerald-600 shadow-sm smooth-transition flex items-center justify-center gap-2";
                btnTracking.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-800 smooth-transition flex items-center justify-center gap-2";
                contentHubs.classList.remove('hidden');
                contentTracking.classList.add('hidden');
                renderHubs();
            }
        }

        function handleRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!email || !password) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            if (users.some(u => u.email === email)) {
                alert('อีเมลนี้ถูกใช้งานแล้ว กรุณาใช้อีเมลอื่นหรือเข้าสู่ระบบ');
                return;
            }

            users.push({ email, password });
            localStorage.setItem('boxflash_users', JSON.stringify(users));
            
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;

            alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
            switchAuthTab('login');
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            const validUser = users.find(u => u.email === email && u.password === password);

            if (!validUser) {
                alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                return;
            }

            const sessionData = { email };
            if (rememberMe) {
                localStorage.setItem('boxflash_logged_user', JSON.stringify(sessionData));
            } else {
                sessionStorage.setItem('boxflash_logged_user', JSON.stringify(sessionData));
            }

            checkAuthStatus();
        }

        function checkAuthStatus() {
            let loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || 'null');

            const authSection = document.getElementById('auth-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const userNavArea = document.getElementById('user-nav-area');
            const userEmailDisplay = document.getElementById('user-email-display');
            const addHubBtn = document.getElementById('btn-add-hub-container');

            if (loggedUser) {
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                userNavArea.classList.remove('hidden');
                userNavArea.classList.add('flex');

                if (loggedUser.email === ADMIN_EMAIL) {
                    userEmailDisplay.innerHTML = `${loggedUser.email} <span class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold">แอดมิน</span>`;
                    addHubBtn.classList.remove('hidden');
                } else {
                    userEmailDisplay.innerHTML = `${loggedUser.email} <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-[10px] font-medium">สมาชิก</span>`;
                    addHubBtn.classList.add('hidden');
                }

                loadHistory();
            } else {
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                userNavArea.classList.add('hidden');
                userNavArea.classList.remove('flex');
            }
        }

        function logout() {
            localStorage.removeItem('boxflash_logged_user');
            sessionStorage.removeItem('boxflash_logged_user');
            checkAuthStatus();
        }

        function trackParcel() {
            const carrier = document.getElementById('carrier').value;
            const trackingNo = document.getElementById('tracking-number').value.trim();

            if (!trackingNo) {
                alert('กรุณากรอกเลขพัสดุก่อนครับ');
                document.getElementById('tracking-number').focus();
                return;
            }

            let targetUrl = '';
            let carrierName = '';

            switch(carrier) {
                case 'flash':
                    carrierName = 'Flash Express';
                    targetUrl = `https://www.flashexpress.co.th/tracking/?se=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'thpost':
                    carrierName = 'ไปรษณีย์ไทย';
                    targetUrl = `https://track.thailandpost.com/?trackNumber=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'kerry':
                    carrierName = 'Kerry (KEX)';
                    targetUrl = `https://th.kexexpress.com/en/track?id=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'j&t':
                    carrierName = 'J&T Express';
                    targetUrl = `https://www.jtexpress.co.th/index/query/gz.html?billcode=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'lalamove':
                    carrierName = 'Lalamove';
                    targetUrl = `https://www.lalamove.com/th-th/`;
                    break;
                default:
                    carrierName = 'ค้นหาทั่วไป';
                    targetUrl = `https://www.google.com/search?q=${encodeURIComponent(trackingNo + ' เช็คพัสดุ')}`;
            }

            saveHistory(carrierName, trackingNo, targetUrl);
            window.open(targetUrl, '_blank');
            
            document.getElementById('tracking-number').value = '';
            loadHistory();
        }

        function getLoggedUserEmail() {
            let loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || '{}');
            return loggedUser.email || 'guest';
        }

        function saveHistory(carrierName, trackingNo, url) {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            if (!allHistory[userEmail]) {
                allHistory[userEmail] = [];
            }

            allHistory[userEmail] = allHistory[userEmail].filter(item => item.trackingNo !== trackingNo);
            allHistory[userEmail].unshift({
                carrierName,
                trackingNo,
                url,
                time: new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' })
            });

            if (allHistory[userEmail].length > 15) {
                allHistory[userEmail].pop();
            }

            localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
        }

        function loadHistory() {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            let userHistory = allHistory[userEmail] || [];

            const historyList = document.getElementById('history-list');
            
            if (userHistory.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">ยังไม่มีประวัติการเช็กพัสดุ</p>`;
                return;
            }

            let html = '';
            userHistory.forEach((item, index) => {
                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200/80 rounded-xl hover:bg-blue-50/50 smooth-transition">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-semibold text-xs">
                                <i class="fas fa-box"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-700">${item.carrierName} <span class="font-normal text-slate-400 text-[11px]">(${item.time})</span></p>
                                <p class="text-sm font-bold text-slate-900 tracking-wide">${item.trackingNo}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="${item.url}" target="_blank" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium smooth-transition shadow-sm flex items-center gap-1">
                                <i class="fas fa-external-link-alt text-[10px]"></i> เปิดดู
                            </a>
                            <button onclick="deleteHistoryItem(${index})" class="p-1.5 text-slate-400 hover:text-rose-600 smooth-transition rounded-lg hover:bg-rose-50">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function deleteHistoryItem(index) {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            if (allHistory[userEmail]) {
                allHistory[userEmail].splice(index, 1);
                localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
                loadHistory();
            }
        }

        function clearHistory() {
            if (confirm('คุณต้องการล้างประวัติการเช็กทั้งหมดใช่หรือไม่?')) {
                const userEmail = getLoggedUserEmail();
                let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
                allHistory[userEmail] = [];
                localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
                loadHistory();
            }
        }

        // ================= HUBS & STORES LOGIC =================
        function renderHubs() {
            const filterCarrier = document.getElementById('hub-filter-carrier').value;
            const searchKeyword = document.getElementById('hub-search-input').value.toLowerCase().trim();
            const hubsListContainer = document.getElementById('hubs-list');
            const loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || '{}');
            const isAdmin = (loggedUser.email === ADMIN_EMAIL);

            let hubs = JSON.parse(localStorage.getItem('boxflash_hubs') || '[]');

            let filtered = hubs.filter(item => {
                const matchCarrier = (filterCarrier === 'all' || item.carrier === filterCarrier);
                const matchSearch = item.name.toLowerCase().includes(searchKeyword) || 
                                    item.area.toLowerCase().includes(searchKeyword) || 
                                    item.address.toLowerCase().includes(searchKeyword);
                return matchCarrier && matchSearch;
            });

            if (filtered.length === 0) {
                hubsListContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">ไม่พบข้อมูลคลังฮับหรือร้านส่งพัสดุตามเงื่อนไข</p>`;
                return;
            }

            let html = '';
            filtered.forEach((hub) => {
                let badgeColor = 'bg-blue-100 text-blue-700';
                let carrierLabel = 'ขนส่ง';
                if (hub.carrier === 'flash') { badgeColor = 'bg-amber-100 text-amber-800'; carrierLabel = 'Flash'; }
                else if (hub.carrier === 'thpost') { badgeColor = 'bg-red-100 text-red-700'; carrierLabel = 'ไปรษณีย์ไทย'; }
                else if (hub.carrier === 'kerry') { badgeColor = 'bg-orange-100 text-orange-800'; carrierLabel = 'Kerry'; }
                else if (hub.carrier === 'j&t') { badgeColor = 'bg-red-50 text-red-600'; carrierLabel = 'J&T'; }
                else if (hub.carrier === 'lalamove') { badgeColor = 'bg-orange-50 text-orange-600'; carrierLabel = 'Lalamove'; }
                else if (hub.carrier === 'partner') { badgeColor = 'bg-emerald-100 text-emerald-800'; carrierLabel = 'ร้านส่งพัสดุเอกชน'; }

                let deleteBtnHtml = isAdmin ? `
                    <button onclick="deleteHub(${hub.id})" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-[11px] rounded-lg smooth-transition" title="ลบสถานที่ (แอดมิน)">
                        <i class="fas fa-trash-alt"></i> ลบ
                    </button>
                ` : '';

                html += `
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2 hover:border-emerald-300 smooth-transition hover:shadow-sm">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${badgeColor} inline-block mb-1">${carrierLabel}</span>
                                <h3 class="font-bold text-slate-800 text-sm">${hub.name}</h3>
                            </div>
                            <span class="text-[11px] bg-slate-200 text-slate-700 px-2 py-1 rounded-lg font-medium">
                                <i class="fas fa-map-pin mr-1 text-rose-500"></i> ${hub.area}
                            </span>
                        </div>
                        <p class="text-xs text-slate-600 flex items-start gap-1.5">
                            <i class="fas fa-map-marker-alt text-slate-400 mt-0.5"></i> ${hub.address}
                        </p>
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pt-2 border-t border-slate-200/60 gap-2">
                            <span class="text-xs text-emerald-700 font-semibold flex items-center gap-1">
                                <i class="far fa-clock"></i> เปิด-ปิด: ${hub.hours}
                            </span>
                            <div class="flex gap-2">
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hub.name + ' ' + hub.address)}" target="_blank" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] rounded-lg font-medium smooth-transition flex items-center gap-1 shadow-sm">
                                    <i class="fas fa-directions"></i> นำทาง
                                </a>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            hubsListContainer.innerHTML = html;
        }

        function openAddHubModal() {
            const modal = document.getElementById('add-hub-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeAddHubModal() {
            const modal = document.getElementById('add-hub-modal');
            const box = document.getElementById('modal-content-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('new-hub-name').value = '';
                document.getElementById('new-hub-area').value = '';
                document.getElementById('new-hub-address').value = '';
                document.getElementById('new-hub-hours').value = '';
            }, 200);
        }

        function saveNewHub() {
            const name = document.getElementById('new-hub-name').value.trim();
            const carrier = document.getElementById('new-hub-carrier').value;
            const area = document.getElementById('new-hub-area').value.trim();
            const address = document.getElementById('new-hub-address').value.trim();
            const hours = document.getElementById('new-hub-hours').value.trim();

            let hubs = JSON.parse(localStorage.getItem('boxflash_hubs') || '[]');
            const newHub = {
                id: Date.now(),
                name,
                carrier,
                area,
                address,
                hours
            };

            hubs.unshift(newHub);
            localStorage.setItem('boxflash_hubs', JSON.stringify(hubs));
            
            closeAddHubModal();
            renderHubs();
            alert('เพิ่มตำแหน่งฮับ/ร้านส่งสำเร็จ!');
        }

        function deleteHub(id) {
            if (confirm('คุณต้องการลบตำแหน่งนี้ออกจากระบบใช่หรือไม่?')) {
                let hubs = JSON.parse(localStorage.getItem('boxflash_hubs') || '[]');
                hubs = hubs.filter(h => h.id !== id);
                localStorage.setItem('boxflash_hubs', JSON.stringify(hubs));
                renderHubs();
            }
        }
    </script>
</body>
</html>
