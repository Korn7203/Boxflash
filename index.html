<!DOCTYPE html>
<html lang="th" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxflash - ค้นหาสาขาขนส่ง & เช็กพัสดุทุกค่าย</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between smooth-transition">

    <!-- Top Navigation / Header -->
    <nav class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-3 shadow-sm sticky top-0 z-50 smooth-transition">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-amber-500 text-white rounded-xl flex items-center justify-center shadow-md transform hover:rotate-6 smooth-transition">
                    <i class="fas fa-shipping-fast text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-800 dark:text-white leading-tight">Boxflash</h1>
                    <p class="text-xs text-slate-400 dark:text-slate-400" data-i18n="nav_subtitle">ค้นหาจุดบริการ & เช็กพัสดุทุกค่าย</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Language Switcher Button -->
                <button onclick="toggleLanguage()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 smooth-transition" id="lang-btn">
                    🇹🇭 TH
                </button>
                <!-- Theme Switcher Button -->
                <button onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 smooth-transition text-amber-500 dark:text-amber-400" id="theme-btn" title="Toggle Theme">
                    <i class="fas fa-sun" id="theme-icon"></i>
                </button>

                <div id="user-nav-area" class="hidden items-center gap-2 ml-1">
                    <div id="user-email-display" class="text-xs font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-full hidden sm:flex items-center gap-1.5 smooth-transition"></div>
                    <button onclick="logout()" class="text-xs text-rose-600 hover:text-rose-700 dark:text-rose-400 font-medium px-3 py-1.5 rounded-lg border border-rose-200 dark:border-rose-900 hover:bg-rose-50 dark:hover:bg-rose-950/50 smooth-transition active:scale-95" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto w-full p-4 md:p-6 my-auto">

        <!-- ================= AUTH SECTION (Login / Register) ================= -->
        <div id="auth-section" class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 smooth-transition">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
                <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-amber-600 border-b-2 border-amber-500 smooth-transition" data-i18n="tab_login">เข้าสู่ระบบ</button>
                <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition" data-i18n="tab_register">สมัครสมาชิก</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_email">อีเมล</label>
                    <input type="email" id="login-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_password">รหัสผ่าน</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-300">
                        <input type="checkbox" id="remember-me" class="rounded border-slate-300 dark:border-slate-700 text-amber-600 focus:ring-amber-500 w-4 h-4">
                        <span data-i18n="remember_me">จดจำการเข้าสู่ระบบ</span>
                    </label>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm text-sm active:scale-[0.99]" data-i18n="btn_login">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="event.preventDefault(); handleRegister();" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_reg_email">อีเมลสำหรับสมัคร</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_reg_password">สร้างรหัสผ่าน</label>
                    <input type="password" id="reg-password" required placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm smooth-transition">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm text-sm active:scale-[0.99]" data-i18n="btn_register">
                    สร้างบัญชีผู้ใช้ใหม่
                </button>
            </form>
        </div>

        <!-- ================= DASHBOARD SECTION ================= -->
        <div id="dashboard-section" class="space-y-6 hidden">
            
            <!-- Dashboard Navigation Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-slate-200 dark:bg-slate-800 p-1.5 rounded-2xl smooth-transition">
                <button onclick="switchMainTab('locator')" id="main-tab-locator" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-700 text-amber-600 dark:text-amber-400 shadow-sm smooth-transition flex items-center justify-center gap-2">
                    <i class="fas fa-map-marked-alt"></i> <span data-i18n="maintab_locator">ค้นหาสาขาบนแผนที่</span>
                </button>
                <button onclick="switchMainTab('tracking')" id="main-tab-tracking" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 smooth-transition flex items-center justify-center gap-2">
                    <i class="fas fa-search-location"></i> <span data-i18n="maintab_tracking">เช็กพัสดุทุกค่าย</span>
                </button>
            </div>

            <!-- TAB 1: MAP LOCATOR BY CARRIER & AREA (NEW) -->
            <div id="content-locator" class="space-y-6 smooth-transition transform transition-all duration-300 opacity-150 translate-y-0">
                <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-5 smooth-transition hover:shadow-md">
                    <div>
                        <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fas fa-compass text-amber-500"></i> <span data-i18n="locator_title">ค้นหาสาขาและจุดบริการขนส่งใกล้คุณ</span>
                        </h2>
                        <p class="text-xs text-slate-400 mt-0.5" data-i18n="locator_sub">เลือกค่ายขนส่งและระบุเขต/จังหวัด ระบบจะนำทางไปหน้าแผนที่ค้นหาทันที</p>
                    </div>

                    <form onsubmit="event.preventDefault(); openMapSearch();" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_select_carrier">เลือกค่ายขนส่ง</label>
                            <select id="map-carrier" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                <option value="Flash Express">🟡 Flash Express (และ Flash Home)</option>
                                <option value="Kerry Express KEX">🟠 Kerry Express (KEX)</option>
                                <option value="ไปรษณีย์ไทย">🔴 ไปรษณีย์ไทย (Thailand Post)</option>
                                <option value="J&T Express">🟢 J&T Express</option>
                                <option value="Ninja Van">⚫ Ninja Van</option>
                                <option value="Best Express">🔵 Best Express</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_map_area">กรอกเขต / อำเภอ / หรือจังหวัด</label>
                            <div class="relative">
                                <input type="text" id="map-area-input" required placeholder="เช่น บางเขน, จตุจักร, เชียงใหม่, ภูเก็ต..." class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                <i class="fas fa-map-marker-alt absolute left-4 top-3.5 text-amber-500 text-base"></i>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3.5 rounded-xl smooth-transition shadow-sm flex items-center justify-center gap-2 text-sm active:scale-[0.99]">
                            <i class="fas fa-external-link-alt"></i> <span data-i18n="btn_open_map">เปิดแผนที่ค้นหาจุดบริการใกล้ฉัน</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- TAB 2: MULTI-CARRIER TRACKING & HISTORY -->
            <div id="content-tracking" class="space-y-6 hidden smooth-transition transform transition-all duration-300 opacity-0 translate-y-2">
                <!-- Tracking Card -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 smooth-transition hover:shadow-md">
                    <h2 class="text-base font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i class="fas fa-search-location text-amber-500"></i> <span data-i18n="track_title">เช็กพัสดุด่วนทุกค่าย</span>
                    </h2>
                    <form onsubmit="event.preventDefault(); trackParcel();" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_carrier">เลือกบริษัทขนส่ง</label>
                            <select id="carrier" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                <option value="flash">Flash Express</option>
                                <option value="thpost">ไปรษณีย์ไทย (Thailand Post)</option>
                                <option value="kerry">Kerry Express (KEX)</option>
                                <option value="j&t">J&T Express</option>
                                <option value="ninjavan">Ninja Van</option>
                                <option value="best">Best Express</option>
                                <option value="lalamove">Lalamove</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_tracking_no">เลขติดตามพัสดุ</label>
                            <div class="relative">
                                <input type="text" id="tracking-number" placeholder="กรอกเลขพัสดุที่นี่..." class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium smooth-transition">
                                <i class="fas fa-barcode absolute left-4 top-3.5 text-slate-400 text-base"></i>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 rounded-xl smooth-transition shadow-sm flex items-center justify-center gap-2 text-sm active:scale-[0.99]" data-i18n="btn_track">
                            <i class="fas fa-external-link-alt"></i> เปิดหน้าเช็กพัสดุ & บันทึกล่าสุด
                        </button>
                    </form>
                </div>

                <!-- Recent History Section -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 smooth-transition hover:shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fas fa-history text-slate-600 dark:text-slate-400"></i> <span data-i18n="history_title">ประวัติการเช็คล่าสุด</span>
                        </h2>
                        <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-700 dark:text-rose-400 font-medium smooth-transition" data-i18n="btn_clear_history">
                            <i class="fas fa-trash-alt mr-1"></i> ล้างประวัติ
                        </button>
                    </div>
                    <div id="history-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-6">
        <p>Boxflash &bull; Multi-Carrier Branch & Tracking System</p>
    </footer>

    <!-- App Logic & Localization Script -->
    <script>
        const ADMIN_EMAIL = 'musicnoa7@gmail.com';
        const ADMIN_PASS = '0918294511';

        const translations = {
            th: {
                nav_subtitle: "ค้นหาจุดบริการ & เช็กพัสดุทุกค่าย",
                tab_login: "เข้าสู่ระบบ",
                tab_register: "สมัครสมาชิก",
                label_email: "อีเมล",
                label_password: "รหัสผ่าน",
                remember_me: "จดจำการเข้าสู่ระบบ",
                btn_login: "เข้าสู่ระบบ",
                label_reg_email: "อีเมลสำหรับสมัคร",
                label_reg_password: "สร้างรหัสผ่าน",
                btn_register: "สร้างบัญชีผู้ใช้ใหม่",
                maintab_locator: "ค้นหาสาขาบนแผนที่",
                maintab_tracking: "เช็กพัสดุทุกค่าย",
                locator_title: "ค้นหาสาขาและจุดบริการขนส่งใกล้คุณ",
                locator_sub: "เลือกค่ายขนส่งและระบุเขต/จังหวัด ระบบจะนำทางไปหน้าแผนที่ค้นหาทันที",
                label_select_carrier: "เลือกค่ายขนส่ง",
                label_map_area: "กรอกเขต / อำเภอ / หรือจังหวัด",
                btn_open_map: "เปิดแผนที่ค้นหาจุดบริการใกล้ฉัน",
                track_title: "เช็กพัสดุด่วนทุกค่าย",
                label_carrier: "เลือกบริษัทขนส่ง",
                label_tracking_no: "เลขติดตามพัสดุ",
                btn_track: "เปิดหน้าเช็กพัสดุ & บันทึกล่าสุด",
                history_title: "ประวัติการเช็คล่าสุด",
                btn_clear_history: "ล้างประวัติ",
                badge_admin: "แอดมิน",
                badge_member: "สมาชิก",
                no_history: "ยังไม่มีประวัติการเช็กพัสดุ"
            },
            en: {
                nav_subtitle: "Find Branches & Track All Carriers",
                tab_login: "Login",
                tab_register: "Register",
                label_email: "Email",
                label_password: "Password",
                remember_me: "Remember me",
                btn_login: "Login",
                label_reg_email: "Email for registration",
                label_reg_password: "Create Password",
                btn_register: "Create New Account",
                maintab_locator: "Find Branch on Map",
                maintab_tracking: "Track All Carriers",
                locator_title: "Find Courier Branches & Service Points Near You",
                locator_sub: "Select carrier and enter area/province to open map search instantly",
                label_select_carrier: "Select Carrier",
                label_map_area: "Enter District / Province",
                btn_open_map: "Open Map & Find Nearby",
                track_title: "Quick Parcel Tracking",
                label_carrier: "Select Carrier",
                label_tracking_no: "Tracking Number",
                btn_track: "Open Tracking & Save History",
                history_title: "Recent History",
                btn_clear_history: "Clear History",
                badge_admin: "Admin",
                badge_member: "Member",
                no_history: "No tracking history yet"
            }
        };

        let currentLang = localStorage.getItem('boxflash_lang') || 'th';
        let currentTheme = localStorage.getItem('boxflash_theme') || 'light';

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initLanguage();
            initAdminAccount();
            checkAuthStatus();
        });

        // Theme Control
        function initTheme() {
            const htmlRoot = document.getElementById('html-root');
            const themeIcon = document.getElementById('theme-icon');
            if (currentTheme === 'dark') {
                htmlRoot.classList.add('dark');
                themeIcon.className = 'fas fa-moon';
            } else {
                htmlRoot.classList.remove('dark');
                themeIcon.className = 'fas fa-sun';
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('boxflash_theme', currentTheme);
            initTheme();
        }

        // Language Control
        function initLanguage() {
            const langBtn = document.getElementById('lang-btn');
            langBtn.innerHTML = currentLang === 'th' ? '🇹🇭 TH' : '🇬🇧 EN';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });
            
            document.getElementById('map-area-input').placeholder = currentLang === 'th' ? 'เช่น บางเขน, จตุจักร, เชียงใหม่, ภูเก็ต...' : 'Enter district, province...';
            document.getElementById('tracking-number').placeholder = currentLang === 'th' ? 'กรอกเลขพัสดุที่นี่...' : 'Enter tracking number here...';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            localStorage.setItem('boxflash_lang', currentLang);
            initLanguage();
            checkAuthStatus();
            loadHistory();
        }

        function initAdminAccount() {
            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            if (!users.some(u => u.email === ADMIN_EMAIL)) {
                users.push({ email: ADMIN_EMAIL, password: ADMIN_PASS });
                localStorage.setItem('boxflash_users', JSON.stringify(users));
            }
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-amber-600 border-b-2 border-amber-500 smooth-transition";
                tabRegister.className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 pb-3 text-sm font-semibold text-emerald-600 border-b-2 border-emerald-600 smooth-transition";
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent smooth-transition";
            }
        }

        // Smooth Main Tab Switcher
        function switchMainTab(tab) {
            const btnLocator = document.getElementById('main-tab-locator');
            const btnTracking = document.getElementById('main-tab-tracking');
            const contentLocator = document.getElementById('content-locator');
            const contentTracking = document.getElementById('content-tracking');

            if (tab === 'locator') {
                btnLocator.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-700 text-amber-600 dark:text-amber-400 shadow-sm smooth-transition flex items-center justify-center gap-2";
                btnTracking.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 smooth-transition flex items-center justify-center gap-2";
                
                contentTracking.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => {
                    contentTracking.classList.add('hidden');
                    contentLocator.classList.remove('hidden');
                    setTimeout(() => {
                        contentLocator.classList.remove('opacity-0', 'translate-y-2');
                        contentLocator.classList.add('opacity-100', 'translate-y-0');
                    }, 20);
                }, 150);
            } else {
                btnTracking.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-700 text-amber-600 dark:text-amber-400 shadow-sm smooth-transition flex items-center justify-center gap-2";
                btnLocator.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 smooth-transition flex items-center justify-center gap-2";
                
                contentLocator.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    contentLocator.classList.add('hidden');
                    contentTracking.classList.remove('hidden');
                    setTimeout(() => {
                        contentTracking.classList.remove('opacity-0', '-translate-y-2');
                        contentTracking.classList.add('opacity-100', 'translate-y-0');
                    }, 20);
                }, 150);
            }
        }

        function handleRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!email || !password) {
                alert(currentLang === 'th' ? 'กรุณากรอกข้อมูลให้ครบถ้วน' : 'Please fill in all fields.');
                return;
            }

            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            if (users.some(u => u.email === email)) {
                alert(currentLang === 'th' ? 'อีเมลนี้ถูกใช้งานแล้ว กรุณาใช้อีเมลอื่นหรือเข้าสู่ระบบ' : 'Email already in use.');
                return;
            }

            users.push({ email, password });
            localStorage.setItem('boxflash_users', JSON.stringify(users));
            
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;

            alert(currentLang === 'th' ? 'สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ' : 'Registration successful! Please login.');
            switchAuthTab('login');
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            let users = JSON.parse(localStorage.getItem('boxflash_users') || '[]');
            const validUser = users.find(u => u.email === email && u.password === password);

            if (!validUser) {
                alert(currentLang === 'th' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'Invalid email or password.');
                return;
            }

            const sessionData = { email };
            if (rememberMe) {
                localStorage.setItem('boxflash_logged_user', JSON.stringify(sessionData));
            } else {
                sessionStorage.setItem('boxflash_logged_user', JSON.stringify(sessionData));
            }

            checkAuthStatus();
        }

        function checkAuthStatus() {
            let loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || 'null');

            const authSection = document.getElementById('auth-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const userNavArea = document.getElementById('user-nav-area');
            const userEmailDisplay = document.getElementById('user-email-display');

            if (loggedUser) {
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                userNavArea.classList.remove('hidden');
                userNavArea.classList.add('flex');

                const adminBadge = translations[currentLang].badge_admin;
                const memberBadge = translations[currentLang].badge_member;

                if (loggedUser.email === ADMIN_EMAIL) {
                    userEmailDisplay.innerHTML = `${loggedUser.email} <span class="bg-amber-500 text-white px-2 py-0.5 rounded-full text-[10px] font-bold">${adminBadge}</span>`;
                } else {
                    userEmailDisplay.innerHTML = `${loggedUser.email} <span class="bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200 px-2 py-0.5 rounded-full text-[10px] font-medium">${memberBadge}</span>`;
                }

                loadHistory();
            } else {
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                userNavArea.classList.add('hidden');
                userNavArea.classList.remove('flex');
            }
        }

        function logout() {
            localStorage.removeItem('boxflash_logged_user');
            sessionStorage.removeItem('boxflash_logged_user');
            checkAuthStatus();
        }

        // Map Search Redirection Function
        function openMapSearch() {
            const carrier = document.getElementById('map-carrier').value;
            const area = document.getElementById('map-area-input').value.trim();

            if (!area) {
                alert(currentLang === 'th' ? 'กรุณากรอกเขตหรือจังหวัด' : 'Please enter an area or province.');
                document.getElementById('map-area-input').focus();
                return;
            }

            // Construct Google Maps Search URL combining carrier and area for "near me" style results
            const searchQuery = `${carrier} ใกล้ฉัน ${area}`;
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(searchQuery)}`;

            window.open(mapUrl, '_blank');
        }

        function trackParcel() {
            const carrier = document.getElementById('carrier').value;
            const trackingNo = document.getElementById('tracking-number').value.trim();

            if (!trackingNo) {
                alert(currentLang === 'th' ? 'กรุณากรอกเลขพัสดุก่อนครับ' : 'Please enter tracking number.');
                document.getElementById('tracking-number').focus();
                return;
            }

            let targetUrl = '';
            let carrierName = '';

            switch(carrier) {
                case 'flash':
                    carrierName = 'Flash Express';
                    targetUrl = `https://www.flashexpress.co.th/tracking/?se=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'thpost':
                    carrierName = currentLang === 'th' ? 'ไปรษณีย์ไทย' : 'Thailand Post';
                    targetUrl = `https://track.thailandpost.com/?trackNumber=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'kerry':
                    carrierName = 'Kerry (KEX)';
                    targetUrl = `https://th.kexexpress.com/en/track?id=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'j&t':
                    carrierName = 'J&T Express';
                    targetUrl = `https://www.jtexpress.co.th/index/query/gz.html?billcode=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'ninjavan':
                    carrierName = 'Ninja Van';
                    targetUrl = `https://www.ninjavan.co/en-th/tracking?id=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'best':
                    carrierName = 'Best Express';
                    targetUrl = `https://www.best-inc.co.th/track?billCode=${encodeURIComponent(trackingNo)}`;
                    break;
                case 'lalamove':
                    carrierName = 'Lalamove';
                    targetUrl = `https://www.lalamove.com/th-th/`;
                    break;
                default:
                    carrierName = 'General Search';
                    targetUrl = `https://www.google.com/search?q=${encodeURIComponent(trackingNo + ' tracking')}`;
            }

            saveHistory(carrierName, trackingNo, targetUrl);
            window.open(targetUrl, '_blank');
            
            document.getElementById('tracking-number').value = '';
            loadHistory();
        }

        function getLoggedUserEmail() {
            let loggedUser = JSON.parse(localStorage.getItem('boxflash_logged_user') || sessionStorage.getItem('boxflash_logged_user') || '{}');
            return loggedUser.email || 'guest';
        }

        function saveHistory(carrierName, trackingNo, url) {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            if (!allHistory[userEmail]) {
                allHistory[userEmail] = [];
            }

            allHistory[userEmail] = allHistory[userEmail].filter(item => item.trackingNo !== trackingNo);
            allHistory[userEmail].unshift({
                carrierName,
                trackingNo,
                url,
                time: new Date().toLocaleString(currentLang === 'th' ? 'th-TH' : 'en-US', { dateStyle: 'short', timeStyle: 'short' })
            });

            if (allHistory[userEmail].length > 15) {
                allHistory[userEmail].pop();
            }

            localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
        }

        function loadHistory() {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            let userHistory = allHistory[userEmail] || [];

            const historyList = document.getElementById('history-list');
            
            if (userHistory.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">${translations[currentLang].no_history}</p>`;
                return;
            }

            let html = '';
            userHistory.forEach((item, index) => {
                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200/80 dark:border-slate-700/80 rounded-xl hover:bg-amber-50/50 dark:hover:bg-slate-700/50 smooth-transition">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 flex items-center justify-center font-semibold text-xs">
                                <i class="fas fa-box"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-700 dark:text-slate-200">${item.carrierName} <span class="font-normal text-slate-400 text-[11px]">(${item.time})</span></p>
                                <p class="text-sm font-bold text-slate-900 dark:text-white tracking-wide">${item.trackingNo}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="${item.url}" target="_blank" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-medium smooth-transition shadow-sm flex items-center gap-1">
                                <i class="fas fa-external-link-alt text-[10px]"></i> ${currentLang === 'th' ? 'เปิดดู' : 'View'}
                            </a>
                            <button onclick="deleteHistoryItem(${index})" class="p-1.5 text-slate-400 hover:text-rose-600 smooth-transition rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/50">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function deleteHistoryItem(index) {
            const userEmail = getLoggedUserEmail();
            let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
            if (allHistory[userEmail]) {
                allHistory[userEmail].splice(index, 1);
                localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
                loadHistory();
            }
        }

        function clearHistory() {
            if (confirm(currentLang === 'th' ? 'คุณต้องการล้างประวัติการเช็กทั้งหมดใช่หรือไม่?' : 'Are you sure you want to clear all history?')) {
                const userEmail = getLoggedUserEmail();
                let allHistory = JSON.parse(localStorage.getItem('boxflash_history') || '{}');
                allHistory[userEmail] = [];
                localStorage.setItem('boxflash_history', JSON.stringify(allHistory));
                loadHistory();
            }
        }
    </script>
</body>
</html>
