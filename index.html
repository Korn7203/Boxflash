<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boxflash - ระบบเช็กพัสดุและค้นหาสาขา</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('tracking-tab')">
        <div class="bg-blue-600 text-white p-2 rounded-xl font-bold text-lg"><i class="fa-solid fa-box-open"></i></div>
        <span class="text-xl font-bold text-blue-600">Boxflash</span>
      </div>
      
      <div class="hidden md:flex space-x-6 text-sm font-medium">
        <button onclick="switchTab('tracking-tab')" class="hover:text-blue-600 transition">เช็กพัสดุ</button>
        <button onclick="switchTab('branch-tab')" class="hover:text-blue-600 transition">ค้นหาสาขา</button>
        <button id="admin-nav" onclick="switchTab('admin-tab')" class="hidden text-red-600 font-semibold hover:underline">จัดการค่ายขนส่ง (Admin)</button>
      </div>

      <div id="user-status" class="flex items-center">
        <!-- จะถูกแทนที่ด้วยปุ่ม Login/Logout โดยอัตโนมัติผ่าน Firebase Auth -->
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="flex-grow max-w-4xl mx-auto w-full p-4 sm:p-6">

    <!-- TAB 1: Tracking & History -->
    <div id="tracking-tab" class="space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-2xl font-bold mb-2">เช็กพัสดุด่วนทุกค่าย</h1>
        <p class="text-gray-500 text-sm mb-6">กรอกหมายเลขพัสดุและเลือกค่ายขนส่งที่คุณต้องการตรวจสอบ</p>
        
        <form onsubmit="trackPackage(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="sm:col-span-2">
              <input type="text" id="tracking-input" placeholder="กรอกเลขพัสดุ เช่น TH123456789" required
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <select id="carrier-select" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Flash Express">Flash Express</option>
                <option value="Kerry (KEX)">Kerry (KEX)</option>
                <option value="J&T Express">J&T Express</option>
                <option value="Thailand Post">ไปรษณีย์ไทย</option>
                <option value="Ninja Van">Ninja Van</option>
                <option value="Best Express">Best Express</option>
                <option value="Lalamove">Lalamove</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition shadow-md shadow-blue-200">
            <i class="fa-solid fa-magnifying-glass mr-2"></i> ค้นหาพัสดุ
          </button>
        </form>

        <div id="tracking-result" class="mt-6"></div>
      </div>

      <!-- User Tracking History (Firestore Integration) -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-bold mb-4"><i class="fa-solid fa-clock-rotate-left mr-2 text-blue-600"></i> ประวัติการเช็กพัสดุของคุณ</h2>
        <div id="history-list" class="space-y-2">
          <p class="text-gray-400 text-sm">กำลังโหลดประวัติ...</p>
        </div>
      </div>
    </div>

    <!-- TAB 2: Branch Locator -->
    <div id="branch-tab" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-2xl font-bold mb-2">ค้นหาสาขาใกล้คุณ</h1>
        <p class="text-gray-500 text-sm mb-6">เลือกค่ายขนส่งและระบุเขต/จังหวัดเพื่อค้นหาบน Google Maps</p>
        
        <form onsubmit="searchBranch(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">ค่ายขนส่ง</label>
            <select id="branch-carrier" class="w-full px-4 py-3 rounded-xl border border-gray-200">
              <option value="Flash Express">Flash Express</option>
              <option value="Kerry Express">Kerry Express</option>
              <option value="J&T Express">J&T Express</option>
              <option value="ไปรษณีย์ไทย">ไปรษณีย์ไทย</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">เขต / อำเภอ / จังหวัด</label>
            <input type="text" id="branch-location" placeholder="เช่น บางรัก กรุงเทพฯ" required
              class="w-full px-4 py-3 rounded-xl border border-gray-200">
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition">
            <i class="fa-solid fa-map-location-dot mr-2"></i> ค้นหาบนแผนที่
          </button>
        </form>
      </div>
    </div>

    <!-- TAB 3: Admin Panel (Only for musicnoa7@gmail.com) -->
    <div id="admin-tab" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="bg-red-100 text-red-600 p-2 rounded-lg"><i class="fa-solid fa-shield-halved"></i></div>
          <h1 class="text-xl font-bold text-red-600">ระบบจัดการค่ายขนส่ง (แอดมิน)</h1>
        </div>
        
        <form onsubmit="addCarrier(event)" class="flex gap-2 mb-6">
          <input type="text" id="new-carrier-name" placeholder="ชื่อค่ายขนส่งใหม่" required
            class="flex-grow px-4 py-2 rounded-xl border border-gray-200 text-sm">
          <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded-xl text-sm font-medium hover:bg-red-700">เพิ่มค่าย</button>
        </form>

        <div id="admin-carrier-list" class="space-y-2">
          <!-- รายการค่ายขนส่งจาก Firestore -->
        </div>
      </div>
    </div>

  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 p-4">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg relative">
      <button onclick="closeModal('login-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h2 class="text-xl font-bold mb-4">เข้าสู่ระบบ</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <input type="email" id="login-email" placeholder="อีเมล" required class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <input type="password" id="login-password" placeholder="รหัสผ่าน" required class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl text-sm font-medium hover:bg-blue-700">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="register-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 p-4">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg relative">
      <button onclick="closeModal('register-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h2 class="text-xl font-bold mb-4">สมัครสมาชิก</h2>
      <form onsubmit="handleRegister(event)" class="space-y-4">
        <input type="email" id="reg-email" placeholder="อีเมล" required class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <input type="password" id="reg-password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" required class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl text-sm font-medium hover:bg-blue-700">ยืนยันสมัครสมาชิก</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: แทนที่ด้วยค่า Firebase Config ของคุณจาก Firebase Console
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userStatus = document.getElementById('user-status');
    const adminNav = document.getElementById('admin-nav');

    // ตรวจสอบสถานะผู้ใช้ (Auth State Observer)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userStatus.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs sm:text-sm font-medium text-gray-600 hidden sm:inline">${user.email}</span>
            <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-red-100 transition">ออกจากระบบ</button>
          </div>
        `;

        // ตรวจสอบสิทธิ์แอดมินพิเศษตามอีเมลที่กำหนด
        if (user.email === 'musicnoa7@gmail.com') {
          adminNav.classList.remove('hidden');
          loadAdminCarriers();
        } else {
          adminNav.classList.add('hidden');
        }
        loadUserHistory(user.uid);
      } else {
        userStatus.innerHTML = `
          <div class="flex space-x-2">
            <button onclick="openModal('login-modal')" class="bg-blue-600 text-white px-4 py-1.5 rounded-xl text-xs sm:text-sm font-medium hover:bg-blue-700">เข้าสู่ระบบ</button>
            <button onclick="openModal('register-modal')" class="bg-gray-100 text-gray-700 px-4 py-1.5 rounded-xl text-xs sm:text-sm font-medium hover:bg-gray-200">สมัครสมาชิก</button>
          </div>
        `;
        adminNav.classList.add('hidden');
        document.getElementById('history-list').innerHTML = '<p class="text-gray-400 text-sm">กรุณาเข้าสู่ระบบเพื่อดูประวัติการเช็กพัสดุ</p>';
      }
    });

    window.handleLogout = () => signOut(auth);

    window.handleLogin = async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
        closeModal('login-modal');
      } catch (err) { alert('เข้าสู่ระบบไม่สำเร็จ: ' + err.message); }
    };

    window.handleRegister = async (e) => {
      e.preventDefault();
      try {
        await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-password').value);
        closeModal('register-modal');
        alert('สมัครสมาชิกสำเร็จ!');
      } catch (err) { alert('สมัครสมาชิกไม่สำเร็จ: ' + err.message); }
    };

    // ระบบเช็กพัสดุและบันทึกลง Firestore
    window.trackPackage = async (e) => {
      e.preventDefault();
      const trackingNo = document.getElementById('tracking-input').value;
      const carrier = document.getElementById('carrier-select').value;
      
      document.getElementById('tracking-result').innerHTML = `
        <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl text-blue-900 text-sm">
          <p class="font-bold">กำลังตรวจสอบพัสดุ: ${trackingNo} (${carrier})</p>
          <p class="text-xs text-blue-700 mt-1">สถานะ: พัสดุกำลังจัดส่งไปยังปลายทาง</p>
        </div>
      `;

      if (auth.currentUser) {
        try {
          await addDoc(collection(db, "tracking_history"), {
            uid: auth.currentUser.uid,
            trackingNo,
            carrier,
            timestamp: serverTimestamp()
          });
          loadUserHistory(auth.currentUser.uid);
        } catch (err) { console.error(err); }
      }
    };

    async function loadUserHistory(uid) {
      try {
        const q = query(collection(db, "tracking_history"), where("uid", "==", uid));
        const snapshot = await getDocs(q);
        let html = '';
        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          html += `<div class="p-3 bg-gray-50 rounded-xl flex justify-between items-center text-sm">
            <div><span class="font-semibold text-blue-600">${d.carrier}</span> : ${d.trackingNo}</div>
            <span class="text-xs text-gray-400">บันทึกแล้ว</span>
          </div>`;
        });
        document.getElementById('history-list').innerHTML = html || '<p class="text-gray-400 text-sm">ยังไม่มีประวัติการเช็กพัสดุ</p>';
      } catch (err) { console.error(err); }
    }

    // ค้นหาสาขา
    window.searchBranch = (e) => {
      e.preventDefault();
      const carrier = document.getElementById('branch-carrier').value;
      const location = document.getElementById('branch-location').value;
      window.open(`https://www.google.com/maps/search/${encodeURIComponent(carrier + ' สาขา ' + location)}`, '_blank');
    };

    // แอดมินจัดการค่ายขนส่ง
    window.loadAdminCarriers = async () => {
      try {
        const snapshot = await getDocs(collection(db, "carriers"));
        let html = '';
        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          html += `<div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl text-sm">
            <span class="font-medium">${d.name}</span>
            <button onclick="deleteCarrier('${docSnap.id}')" class="text-red-500 hover:underline text-xs">ลบ</button>
          </div>`;
        });
        document.getElementById('admin-carrier-list').innerHTML = html || '<p class="text-gray-400 text-sm">ยังไม่มีค่ายขนส่ง</p>';
      } catch (err) { console.error(err); }
    };

    window.addCarrier = async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-carrier-name').value;
      try {
        await addDoc(collection(db, "carriers"), { name });
        document.getElementById('new-carrier-name').value = '';
        loadAdminCarriers();
      } catch (err) { alert(err.message); }
    };

    window.deleteCarrier = async (id) => {
      if (confirm('ยืนยันการลบ?')) {
        try {
          await deleteDoc(doc(db, "carriers", id));
          loadAdminCarriers();
        } catch (err) { alert(err.message); }
      }
    };

    // ควบคุม Modal & Tab
    window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
    window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
    window.switchTab = (id) => {
      ['tracking-tab', 'branch-tab', 'admin-tab'].forEach(tab => document.getElementById(tab).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    };
  </script>
</body>
</html>
